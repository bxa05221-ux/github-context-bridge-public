name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run self observation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.self_observe > self-observation.json
      - name: Upload self observation
        uses: actions/upload-artifact@v4
        with:
          name: self-observation
          path: self-observation.json
