        status: "CONFIRMED"
        evidence_id: "ev-ed8dc46eb258bcc1"
        observation: "Plan / Build / Judgeを分離し、JudgeはBuildから独立し、deterministicな判定を行うべきと定義している。Buildがacceptance conditionを書き換えて合格することも禁止している。"
      - role: "事実確認担当"
        source: "skills/continuous-learning-v2/SKILL.md"
        type: "learning_pipeline"
        status: "CONFIRMED"
        evidence_id: "ev-3db1f3af907f6bef"
        observation: "session activityをhooksで観測し、observations.jsonlへ保存し、background observerがpattern detectionを行い、instinctをskills/commands/agentsへ発展させる構造を記載している。"
      - role: "ルール担当"
        source: "skills/continuous-learning-v2/SKILL.md"
        type: "scope_boundary"
        status: "CONFIRMED"
        evidence_id: "ev-07b717ebe6d84737"
        observation: "project-scoped instinctsとglobalな学習を分離し、cross-project contaminationを抑える設計を採用している。"
      - role: "事実確認担当"
        source: "package.json"
